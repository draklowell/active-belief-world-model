name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            pkg-config \
            libjpeg-dev \
            zlib1g-dev \
            libfreetype6-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install Python dependencies
        run: uv sync --locked

      - name: flake8
        run: uv run --locked --no-sync flake8 src/ scripts/ tests/ app/

      - name: black --check
        run: uv run --locked --no-sync black --check src/ scripts/ tests/ app/

      - name: isort --check
        run: uv run --locked --no-sync isort --check-only src/ scripts/ tests/ app/

      - name: ty
        run: uv run --locked --no-sync ty check

      - name: mdformat --check
        run: git ls-files -z '*.md' | xargs -0 uv run --locked --no-sync mdformat --check
