name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: apt update && apt install -y build-essential libsdl2-dev && uv sync --locked

      - name: flake8
        run: uv run flake8 src/ scripts/ tests/ app/

      - name: black --check
        run: uv run black --check src/ scripts/ tests/ app/

      - name: isort --check
        run: uv run isort --check src/ scripts/ tests/ app/

      - name: ty
        run: uv run ty check

      - name: mdformat --check
        run: git ls-files -z '*.md' | xargs -0 uv run --locked --no-sync mdformat --check
