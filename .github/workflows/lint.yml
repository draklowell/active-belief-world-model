name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install lint tools
        run: pip install flake8==7.3.0 black==26.5.1 isort==8.0.1

      - name: flake8
        run: flake8 src/ scripts/ tests/ app/

      - name: black --check
        run: black --check src/ scripts/ tests/ app/

      - name: isort --check
        run: isort --check src/ scripts/ tests/ app/
