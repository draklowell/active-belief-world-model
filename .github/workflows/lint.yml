name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.15

      - name: Install Arrow C++ SDK for PyArrow on Python 3.15
        run: |
          codename=$(lsb_release --codename --short)
          wget "https://packages.apache.org/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-$codename.deb"
          sudo apt-get install -y "./apache-arrow-apt-source-latest-$codename.deb"
          sudo apt-get update
          sudo apt-get install -y \
            libarrow-dev=24.0.0-1 libarrow-acero-dev=24.0.0-1 \
            libarrow-compute-dev=24.0.0-1 \
            libarrow-dataset-dev=24.0.0-1 libarrow-flight-dev=24.0.0-1 \
            libarrow-flight-sql-dev=24.0.0-1 libparquet-dev=24.0.0-1

      - name: Install dependencies
        run: uv sync --locked
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          # Match the installed SDK components used by this CPU project.
          PYARROW_WITH_CUDA: "0"
          PYARROW_WITH_GANDIVA: "0"

      - name: flake8
        run: uv run flake8 src/ scripts/ tests/ app/

      - name: black --check
        run: uv run black --check src/ scripts/ tests/ app/

      - name: isort --check
        run: uv run isort --check src/ scripts/ tests/ app/

      - name: ty
        run: uv run ty check
