[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wine-origin"
version = "0.1.0"
description = "Wine cultivar classification example project (course template)"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "numpy==2.5.2",
    "polars==2.0.0",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "joblib==1.5.3",
    "PyYAML==6.0.3",
    "streamlit==1.61.1",
    "huggingface_hub==1.27.0",
]

[dependency-groups]
dev = [
    "flake8==7.3.0",
    "black[jupyter]==26.5.1",
    "isort==8.0.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pre-commit==4.6.1",
    "jupyter==1.1.1",
    "nbconvert==7.17.1",
    "ipykernel==7.3.0",
    "nbstripout==0.9.1",
    "ty>=0.0.86",
    "marimo>=0.25.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-version = ">=0.13.0"
python-preference = "only-managed"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "scripts", "tests", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
