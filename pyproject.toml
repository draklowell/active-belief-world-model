[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wine-origin"
version = "0.1.0"
description = "Wine cultivar classification example project (course template)"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<2",
    "polars==2.0.0",
    "scikit-learn==1.9.1",
    "joblib==1.5.3",
    "PyYAML==6.0.3",
    "Pillow~=11.0.0",
    "streamlit==1.61.1",
    "huggingface_hub==1.27.0",
    "plotly==7.1.0",
    "plotly-express==0.4.1",
    "kaleido==1.5.0",
    "desktop-env==1.0.2",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "python-decouple==3.8",
    "openai==3.35.1",
    "backoff==2.2.1",
    "beautifulsoup4>=4.12",
    "mlflow>=3.17.1",
]

[dependency-groups]
dev = [
    "flake8==7.3.0",
    "black[jupyter]==26.5.1",
    "isort==8.0.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pre-commit==4.6.1",
    "jupyter==1.1.1",
    "nbconvert==7.17.1",
    "ipykernel==7.3.0",
    "nbstripout==0.9.1",
    "ty>=0.0.86",
    "mdformat==1.0.0",
    "mdformat-gfm==1.0.0",
    "mdformat-frontmatter==2.1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-version = ">=0.13.0"
python-preference = "only-managed"
constraint-dependencies = [
    "borb==2.1.25",
    "matplotlib>=3.10.7,<4",
]
exclude-dependencies = [
    { package = { name = "desktop-env" }, dependencies = [
        "torch",
        "transformers",
        "accelerate",
        "openai",
        "anthropic",
        "google-genai",
        "google-generativeai",
        "groq",
        "dashscope",
        "ag2",
        "ui-tars",
        "parallel-web",
        "paddlepaddle",
        "pygame",
        "matplotlib"
    ]}
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ty.environment]
python-version = "3.14"
extra-paths = [".agents/skills/experimental-design/scripts"]

[tool.ty.src]
include = ["src", "scripts", "tests", "app", ".agents/skills/experimental-design"]

[tool.pytest.ini_options]
testpaths = ["tests", ".agents/skills/experimental-design/tests"]
addopts = "-ra"
